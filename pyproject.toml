[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tklds"
version = "0.2.0"
description = "High-dimensional Sobol sequences and direction numbers for quasi-Monte Carlo simulation"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  { name = "Andres Oliva Denis", email = "andres@tenokonda.com" },
  { name = "James Wheeldon", email = "james@tenokonda.com" },
  { name = "Ilya Manyakin", email = "ilya@tenokonda.com" },
  { name = "Adrien Papaioannou", email = "adrien@tenokonda.com" },
]
keywords = [
  "sobol",
  "sobol-sequences",
  "quasi-monte-carlo",
  "low-discrepancy",
  "direction-numbers",
  "numerical-integration",
  "scientific-computing",
  "monte-carlo-simulation",
]
classifiers = [
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.23.5",
  "pandas>=1.5.3",
  "scipy>=1.8.1",
  "sympy>=1.12",
  "tqdm>=4.65.0",
]

[project.optional-dependencies]
examples = [
  "graphviz>=0.20.1",
  "holidays>=0.10.5.2",
  "ipykernel>=6",
  "jupyterlab>=4",
  "jsonschema>=4.18.0",
  "matplotlib>=3.7.0",
  "psutil>=5.8.0",
  "seaborn>=0.13.2",
  "statsmodels>=0.13.5",
]
test = [
  "pytest>=8",
  "pytest-cov>=5",
]
build = [
  "build>=1.2",
  "twine>=5",
]

[project.urls]
Homepage = "https://github.com/TENOKONDA/tklds"
Documentation = "https://github.com/TENOKONDA/tklds#readme"
Source = "https://github.com/TENOKONDA/tklds"
Issues = "https://github.com/TENOKONDA/tklds/issues"
Releases = "https://github.com/TENOKONDA/tklds/releases"
Paper = "https://ssrn.com/abstract=7040539"
Citation = "https://github.com/TENOKONDA/tklds/blob/main/CITATION.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["tklds*"]

[tool.setuptools.package-data]
tklds = [
  "direction_numbers/new-joe-kuo-6.21201",
  "direction_numbers/tkrgsobol_a_ap5_50000",
  "direction_numbers/*.pickle",
  "direction_numbers/README.md",
]
